# Render-Blueprint: richtet die Academy in einem EU-Rechenzentrum (Frankfurt) ein.
# Anleitung: DEPLOY_ANLEITUNG.md
services:
  - type: web
    name: hr-future-thinkers-academy
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    disk:
      name: academy-daten
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ACADEMY_HOST
        value: 0.0.0.0
      - key: ACADEMY_DATA_FILE
        value: /var/data/academy-state.json
      - key: ACADEMY_BACKUP_DIR
        value: /var/data/backups
      - key: ACADEMY_SECURE_COOKIE
        value: "1"
      - key: ACADEMY_SETUP_KEY
        generateValue: true
